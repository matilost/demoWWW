<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Domek 3D/AR Demo</title>

    <!-- Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            height: 100vh;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
        }

        model-viewer::part(default-progress-bar) {
            background-color: #667eea;
            height: 4px;
        }

        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            min-width: 280px;
            max-width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
            z-index: 10;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #ui-panel h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #status {
            font-size: 13px;
            margin-bottom: 15px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(102, 126, 234, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .status-badge.success {
            background: rgba(52, 211, 153, 0.3);
            border-color: rgba(52, 211, 153, 0.5);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-ar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-ar:hover {
            background: linear-gradient(135deg, #5568d3 0%, #653a8b 100%);
        }

        /* Controls Info */
        #controls-info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            line-height: 1.6;
        }

        #controls-info strong {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        /* Info Box */
        #info-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.5s ease;
            z-index: 5;
            max-width: 90%;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #ui-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                min-width: auto;
                max-width: none;
                padding: 15px;
            }

            #ui-panel h1 {
                font-size: 20px;
            }

            #controls-info {
                font-size: 11px;
            }

            #info-box {
                bottom: 15px;
                font-size: 13px;
                padding: 10px 20px;
            }
        }

        /* Loading State */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom AR Button (ukryty, używamy własnego) */
        model-viewer::part(default-ar-button) {
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <model-viewer
            id="model-viewer"
            src="./domek.glb"
            ios-src="./domek.usdz"
            alt="Domek 3D"
            shadow-intensity="1"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            auto-rotate-delay="3000"
            rotation-per-second="30deg"
            interaction-prompt="none"
            loading="eager"
            reveal="auto"
        >
            <div class="loading-overlay" id="loading-overlay" slot="poster">
                <div class="loader"></div>
                <div style="font-size: 18px; font-weight: 500;">Ładowanie modelu 3D...</div>
                <div id="loading-percent" style="font-size: 14px; opacity: 0.8; margin-top: 10px;">0%</div>
            </div>
        </model-viewer>

        <div id="ui-panel">
            <h1>🏠 Domek 3D/AR</h1>
            <div id="status">
                Inicjalizacja...
            </div>
            <button id="btn-ar" class="btn btn-ar">
                <span id="ar-icon">📱</span>
                <span id="ar-text">Uruchom AR</span>
            </button>
            <button id="btn-reset" class="btn">🔄 Reset widoku</button>
            <button id="btn-rotate" class="btn">
                <span id="rotate-icon">⏸️</span>
                <span id="rotate-text">Zatrzymaj rotację</span>
            </button>
            <div id="controls-info">
                <strong>Sterowanie 3D:</strong>
                📱 Dotyk: przeciągnij aby obrócić<br>
                🖱️ Mysz: przeciągnij aby obrócić<br>
                🔍 Pinch/scroll: zoom<br>
                ↔️ Dwa palce: przesuwanie
            </div>
        </div>

        <div id="info-box"></div>
    </div>

    <script>
        const modelViewer = document.getElementById('model-viewer');
        const statusDiv = document.getElementById('status');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingPercent = document.getElementById('loading-percent');
        const btnAR = document.getElementById('btn-ar');
        const btnReset = document.getElementById('btn-reset');
        const btnRotate = document.getElementById('btn-rotate');
        const infoBox = document.getElementById('info-box');
        const arIcon = document.getElementById('ar-icon');
        const arText = document.getElementById('ar-text');
        const rotateIcon = document.getElementById('rotate-icon');
        const rotateText = document.getElementById('rotate-text');

        let isRotating = true;
        let isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        let isAndroid = /Android/.test(navigator.userAgent);

        // Detect AR capability
        function checkARSupport() {
            const canAR = modelViewer.canActivateAR;

            if (canAR) {
                if (isIOS) {
                    statusDiv.innerHTML = 'Gotowe! 🎉<div class="status-badge success">AR przez Quick Look</div>';
                    arIcon.textContent = '🍎';
                    arText.textContent = 'AR (Quick Look)';
                    showInfo('Na iOS użyj przycisku AR aby otworzyć Quick Look');
                } else if (isAndroid) {
                    statusDiv.innerHTML = 'Gotowe! 🎉<div class="status-badge success">AR przez Scene Viewer</div>';
                    arIcon.textContent = '🤖';
                    arText.textContent = 'AR (Scene Viewer)';
                    showInfo('Na Android użyj przycisku AR');
                } else {
                    statusDiv.innerHTML = 'Gotowe! 🎉<div class="status-badge success">AR dostępne</div>';
                }
            } else {
                if (isIOS) {
                    statusDiv.innerHTML = 'Model załadowany<div class="status-badge">Brak pliku USDZ dla iOS AR</div>';
                    btnAR.style.opacity = '0.5';
                    btnAR.style.cursor = 'not-allowed';
                    showInfo('Potrzebujesz pliku .usdz dla AR na iOS. Konwertuj GLB→USDZ online.');
                } else {
                    statusDiv.innerHTML = 'Model załadowany<div class="status-badge">AR niedostępne na tym urządzeniu</div>';
                    btnAR.style.display = 'none';
                }
            }
        }

        // Loading progress
        modelViewer.addEventListener('progress', (event) => {
            const progress = event.detail.totalProgress * 100;
            loadingPercent.textContent = `${Math.round(progress)}%`;
        });

        // Model loaded
        modelViewer.addEventListener('load', () => {
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                checkARSupport();
            }, 500);
        });

        // AR Button Click
        btnAR.addEventListener('click', () => {
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            }
        });

        // Reset View
        btnReset.addEventListener('click', () => {
            modelViewer.resetTurntableRotation();
            modelViewer.interpolationDecay = 100;
            modelViewer.cameraOrbit = 'auto auto auto';
            modelViewer.fieldOfView = 'auto';
            showInfo('Widok zresetowany');
        });

        // Toggle Rotation
        btnRotate.addEventListener('click', () => {
            isRotating = !isRotating;
            if (isRotating) {
                modelViewer.autoRotate = true;
                rotateIcon.textContent = '⏸️';
                rotateText.textContent = 'Zatrzymaj rotację';
            } else {
                modelViewer.autoRotate = false;
                rotateIcon.textContent = '▶️';
                rotateText.textContent = 'Włącz rotację';
            }
        });

        // Show Info Box
        function showInfo(message, duration = 3000) {
            infoBox.textContent = message;
            infoBox.style.display = 'block';
            setTimeout(() => {
                infoBox.style.display = 'none';
            }, duration);
        }

        // AR Session Events
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                showInfo('Sesja AR uruchomiona!', 2000);
            } else if (event.detail.status === 'not-presenting') {
                showInfo('AR zakończone', 2000);
            }
        });

        // Camera Change
        let cameraChangeTimeout;
        modelViewer.addEventListener('camera-change', () => {
            clearTimeout(cameraChangeTimeout);
            cameraChangeTimeout = setTimeout(() => {
                // Możesz tutaj dodać logikę po zmianie kamery
            }, 500);
        });

        // Initial message
        setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden')) {
                showInfo('Ładowanie może potrwać chwilę...', 2000);
            }
        }, 2000);
    </script>
</body>
</html>
