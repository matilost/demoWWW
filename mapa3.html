<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Myśli - Interaktywna Nawigacja</title>
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0e16;
            --bg-secondary: #151922;
            --bg-elevated: #1f2530;
            --text-primary: #e8eaed;
            --text-secondary: #9ba1a9;
            --text-tertiary: #6b7280;
            --accent-1: #6366f1;
            --accent-2: #8b5cf6;
            --accent-3: #ec4899;
            --accent-4: #10b981;
            --accent-5: #f59e0b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --transition: cubic-bezier(0.4, 0.0, 0.2, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
        }

        /* ========== ANIMATED BACKGROUND ========== */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .bg-gradient {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.12), transparent 40%),
                radial-gradient(circle at 40% 80%, rgba(236, 72, 153, 0.1), transparent 40%);
            animation: gradientMove 25s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-5%, -5%) rotate(120deg); }
            66% { transform: translate(5%, 5%) rotate(240deg); }
        }

        .bg-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }

        /* ========== INTRO SCREEN ========== */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 1s var(--transition), transform 1s var(--transition);
        }

        #intro-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .intro-title {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: fadeInUp 1s var(--spring);
        }

        .intro-subtitle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            animation: fadeInUp 1s var(--spring) 0.2s backwards;
        }

        .enter-btn {
            padding: 1.25rem 3rem;
            font-size: 1.125rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--spring);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
            animation: fadeInUp 1s var(--spring) 0.4s backwards;
        }

        .enter-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.6);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== HEADER UI ========== */
        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 14, 22, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            cursor: help;
            transition: transform 0.3s var(--spring);
        }

        .stat-item:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-1);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ========== MAP VIEW ========== */
        #map-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
            transition: transform 0.1s ease-out;
        }

        #map-container.dragging {
            cursor: grabbing;
        }

        .map-node {
            position: absolute;
            width: 280px;
            transform-origin: center;
            cursor: move;
            z-index: 1;
            transition: z-index 0s, box-shadow 0.3s var(--spring);
        }

        .map-node.dragging {
            z-index: 1000 !important;
            cursor: grabbing;
        }

        .map-node.active {
            z-index: 100 !important;
        }

        .map-node:hover:not(.dragging) {
            z-index: 50;
        }

        .node-card {
            background: rgba(31, 37, 48, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: var(--shadow);
            transition: all 0.4s var(--spring);
        }

        .map-node:hover:not(.dragging) .node-card {
            border-color: var(--accent-1);
            box-shadow: var(--shadow-lg), 0 0 40px rgba(99, 102, 241, 0.3);
            transform: translateY(-5px) scale(1.02);
        }

        .map-node.dragging .node-card {
            border-color: var(--accent-3);
            box-shadow: 0 30px 80px rgba(236, 72, 153, 0.5);
            transform: scale(1.05);
        }

        .node-image {
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        }

        .node-svg {
            width: 100%;
            height: 100%;
            transition: transform 0.6s var(--spring);
        }

        .map-node:hover:not(.dragging) .node-svg {
            transform: scale(1.1);
        }

        .node-content {
            padding: 1.5rem;
        }

        .node-tag {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent-1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .node-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .node-preview {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .node-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(99, 102, 241, 0.1);
        }

        .read-time {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .node-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            transition: transform 0.3s var(--spring);
        }

        .map-node:hover:not(.dragging) .node-arrow {
            transform: translateX(4px);
        }

        /* ========== DRAG HINT ========== */
        .drag-hint {
            position: fixed;
            bottom: 8rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 37, 48, 0.9);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--text-secondary);
            font-size: 0.875rem;
            z-index: 100;
            animation: fadeInUp 1s var(--spring) 2s backwards, pulse 2s ease-in-out infinite 3s;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ========== EXPANDED NODE ========== */
        .node-expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            background: rgba(15, 19, 28, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s var(--spring);
            z-index: 2000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .node-expanded.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        .expanded-header {
            position: relative;
            height: 300px;
            overflow: hidden;
        }

        .expanded-image {
            width: 100%;
            height: 100%;
        }

        .expanded-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: linear-gradient(to top, rgba(10, 14, 22, 0.95), transparent);
        }

        .expanded-tag {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(99, 102, 241, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            font-size: 0.875rem;
            color: var(--accent-1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .expanded-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .expanded-preview {
            font-size: 1.125rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .expanded-body {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        .expanded-sections {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-preview {
            padding: 1.25rem;
            background: rgba(31, 37, 48, 0.4);
            border-radius: 12px;
            border-left: 3px solid var(--accent-1);
            transition: all 0.3s var(--transition);
        }

        .section-preview:hover {
            background: rgba(31, 37, 48, 0.6);
            transform: translateX(4px);
        }

        .section-preview h4 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .section-preview p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .expanded-actions {
            display: flex;
            gap: 1rem;
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(99, 102, 241, 0.1);
            background: rgba(10, 14, 22, 0.5);
        }

        .action-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--spring);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: rgba(31, 37, 48, 0.6);
            color: var(--text-primary);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(31, 37, 48, 0.8);
            border-color: var(--accent-1);
        }

        .close-expanded {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(10, 14, 22, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s var(--spring);
            z-index: 10;
        }

        .close-expanded:hover {
            background: rgba(236, 72, 153, 0.3);
            border-color: var(--accent-3);
            transform: rotate(90deg);
        }

        /* ========== CONNECTIONS ========== */
        .connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ========== CONTROLS ========== */
        .map-controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 100;
        }

        .control-btn {
            width: 52px;
            height: 52px;
            border: none;
            background: rgba(31, 37, 48, 0.8);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 300;
            transition: all 0.3s var(--spring);
            box-shadow: var(--shadow);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .control-btn:hover {
            background: rgba(31, 37, 48, 1);
            border-color: var(--accent-1);
            transform: translateY(-4px) scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        .control-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* ========== MINIMAP ========== */
        .minimap {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            width: 200px;
            height: 150px;
            background: rgba(31, 37, 48, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 1rem;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .minimap-title {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .minimap-canvas {
            width: 100%;
            height: calc(100% - 1.5rem);
            border-radius: 8px;
            background: rgba(10, 14, 22, 0.5);
        }

        /* ========== ARTICLE VIEW ========== */
        #article-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-primary);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s var(--transition);
            z-index: 5000;
            overflow-y: auto;
        }

        #article-view.visible {
            opacity: 1;
            pointer-events: all;
        }

        .article-hero {
            position: relative;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hero-bg svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            padding: 2rem;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.625rem 1.5rem;
            background: rgba(99, 102, 241, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            font-size: 0.875rem;
            color: var(--accent-1);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            margin-bottom: 2rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-lead {
            font-size: 1.5rem;
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 700px;
            margin: 0 auto;
        }

        .article-body {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .article-section {
            margin-bottom: 4rem;
        }

        .article-section h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            position: relative;
            padding-left: 1.5rem;
        }

        .article-section h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.5rem;
            width: 4px;
            height: 2rem;
            background: linear-gradient(to bottom, var(--accent-1), var(--accent-2));
            border-radius: 2px;
        }

        .article-section p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 1.5rem;
        }

        .article-callout {
            background: rgba(99, 102, 241, 0.08);
            border-left: 4px solid var(--accent-1);
            padding: 2rem;
            margin: 3rem 0;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .article-callout::before {
            content: '"';
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-size: 4rem;
            color: var(--accent-1);
            opacity: 0.2;
            font-family: Georgia, serif;
        }

        .article-callout p {
            position: relative;
            font-size: 1.375rem;
            font-style: italic;
            color: var(--text-primary);
            margin: 0;
            padding-left: 2rem;
        }

        .article-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 5rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(99, 102, 241, 0.1);
        }

        .nav-card {
            padding: 2rem;
            background: rgba(31, 37, 48, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            cursor: pointer;
            transition: all 0.4s var(--spring);
            position: relative;
            overflow: hidden;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s var(--spring);
        }

        .nav-card:hover::before {
            transform: scaleX(1);
        }

        .nav-card:hover {
            border-color: var(--accent-1);
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .nav-card h3 {
            font-size: 1.125rem;
            margin-bottom: 0.75rem;
            color: var(--accent-1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-card p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .intro-title {
                font-size: 2.5rem;
            }

            .intro-subtitle {
                font-size: 1.125rem;
            }

            .main-header {
                padding: 1rem;
            }

            .header-stats {
                gap: 1rem;
            }

            .stat-value {
                font-size: 1.25rem;

        // ========== PARTICLES SYSTEM ==========
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            for (let i = 0; i < 50; i++) {
                state.particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                state.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
                    ctx.fill();

                    state.particles.forEach(p2 => {
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(99, 102, 241, ${0.1 * (1 - dist / 150)})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    });
                });

                requestAnimationFrame(animateParticles);
            }

            animateParticles();
        }

        // ========== INITIALIZATION ==========

            setupEventListeners();
            renderMap();
            animate();

                    baseY: article.position.y,
                    vx: 0,
                    vy: 0,
                    offset: Math.random() * Math.PI * 2

                container.appendChild(node);

            renderConnections();
            updateMinimap();

        function createNode(article, index) {
            const node = document.createElement('div');
            node.className = 'map-node';
            node.style.zIndex = 10 + index;
            node.dataset.id = article.id;

            const delay = index * 0.1;
            node.style.animation = `fadeInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}s backwards`;

            node.innerHTML = `
                <div class="node-card">
                    <div class="node-image">
                        ${generateNodeIllustration(article)}
                    </div>
                    <div class="node-content">
                        <span class="node-tag">${article.tag}</span>
                        <h3 class="node-title">${article.title}</h3>
                        <p class="node-preview">${article.preview}</p>
                        <div class="node-meta">
                            <span class="read-time">⏱ ${article.readTime}</span>
                            <div class="node-arrow">→</div>
                        </div>
                    </div>
                </div>
            `;

            // Node drag events
            node.addEventListener('mousedown', (e) => handleNodeDragStart(e, article.id));
            node.addEventListener('touchstart', (e) => handleNodeDragStart(e, article.id), { passive: false });

            // Click to expand (only if not dragging)
            node.addEventListener('click', (e) => {
                if (!state.draggedNode) {
                    expandNode(article);
                }
            });

            return node;
        }

                        </defs>

                            </polygon>

                                <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="25s" repeatCount="indefinite"/>

                    </svg>
                `,
                'notatnik-idei': `
                    <svg class="node-svg" viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="grad-${article.id}">

                            </radialGradient>

                `,
                'mikrokosmos': `

                'mapa-jako-opowiesc': `
                    <svg class="node-svg" viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">

            return illustrations[article.id] || '';
        }

        function renderConnections() {
            const svg = document.getElementById('connections');
            svg.innerHTML = '';
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');

            if (!state.showConnections) return;

            articles.forEach(article => {
                article.connections.forEach(connId => {
                    const targetArticle = articles.find(a => a.id === connId);
                    if (!targetArticle) return;

                    const sourceNode = state.nodes.find(n => n.id === article.id);
                    const targetNode = state.nodes.find(n => n.id === connId);

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const x1 = sourceNode.x + 140;
                    const y1 = sourceNode.y + 90;
                    const x2 = targetNode.x + 140;
                    const y2 = targetNode.y + 90;

                    const midX = (x1 + x2) / 2;
                    const midY = (y1 + y2) / 2;
                    const offset = 50;

                    const d = `M ${x1} ${y1} Q ${midX} ${midY - offset} ${x2} ${y2}`;
                    line.setAttribute('d', d);
                    line.setAttribute('stroke', 'rgba(99, 102, 241, 0.2)');
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('fill', 'none');
                    line.setAttribute('stroke-dasharray', '5,5');

                    const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                    animate.setAttribute('attributeName', 'stroke-dashoffset');
                    animate.setAttribute('from', '0');
                    animate.setAttribute('to', '10');
                    animate.setAttribute('dur', '1s');
                    animate.setAttribute('repeatCount', 'indefinite');
                    line.appendChild(animate);

                    svg.appendChild(line);
                });
            });
        }

        // ========== NODE DRAGGING ==========
        function handleNodeDragStart(e, nodeId) {
            e.stopPropagation();

            const isTouchEvent = e.type === 'touchstart';
            const clientX = isTouchEvent ? e.touches[0].clientX : e.clientX;
            const clientY = isTouchEvent ? e.touches[0].clientY : e.clientY;

            state.draggedNode = nodeId;
            state.dragStart = { x: clientX, y: clientY };

            const nodeElement = document.querySelector(`[data-id="${nodeId}"]`);
            nodeElement.classList.add('dragging');

            if (isTouchEvent) {
                e.preventDefault();
            }
        }

        function handleNodeDrag(e) {
            if (!state.draggedNode) return;

            const isTouchEvent = e.type === 'touchmove';
            const clientX = isTouchEvent ? e.touches[0].clientX : e.clientX;
            const clientY = isTouchEvent ? e.touches[0].clientY : e.clientY;

            const dx = clientX - state.dragStart.x;
            const dy = clientY - state.dragStart.y;

            const node = state.nodes.find(n => n.id === state.draggedNode);
            if (node) {
                node.x = node.baseX + dx / state.mapTransform.scale;
                node.y = node.baseY + dy / state.mapTransform.scale;
            }

            if (isTouchEvent) {
                e.preventDefault();
            }
        }

        function handleNodeDragEnd() {
            if (state.draggedNode) {
                const nodeElement = document.querySelector(`[data-id="${state.draggedNode}"]`);
                if (nodeElement) {
                    nodeElement.classList.remove('dragging');
                }

                const node = state.nodes.find(n => n.id === state.draggedNode);
                if (node) {
                    // Update base position to current for spring effect
                    node.baseX = node.x;
                    node.baseY = node.y;
                }

                state.draggedNode = null;
            }
        }

        // ========== EXPANDED NODE ==========
        function expandNode(article) {
            state.expandedNode = article;
            const view = document.getElementById('expanded-view');

            document.getElementById('expanded-tag').textContent = article.tag;
            document.getElementById('expanded-title').textContent = article.title;
            document.getElementById('expanded-preview').textContent = article.preview;
            document.getElementById('expanded-image').innerHTML = generateExpandedIllustration(article);

            const sectionsHtml = article.sections.map(section => `
                <div class="section-preview">
                    <h4>${section.title}</h4>
                    <p>${section.content.substring(0, 150)}...</p>
                </div>
            `).join('');

            document.getElementById('expanded-sections').innerHTML = sectionsHtml;

            view.classList.add('visible');

            document.querySelectorAll('.map-node').forEach(node => {
                if (node.dataset.id === article.id) {
                    node.classList.add('active');
                }
            });
        }

        function closeExpanded() {
            document.getElementById('expanded-view').classList.remove('visible');
            document.querySelectorAll('.map-node').forEach(node => {
                node.classList.remove('active');
            });
            state.expandedNode = null;
        }

        function readFullArticle() {
            if (!state.expandedNode) return;
            showArticle(state.expandedNode);
            closeExpanded();
        }

        function generateExpandedIllustration(article) {
            return generateNodeIllustration(article).replace('280 180', '900 300').replace('node-svg', 'expanded-svg');
        }

        // ========== ARTICLE VIEW ==========
        function showArticle(article) {
            state.view = 'article';
            state.currentArticle = article;

            document.getElementById('article-tag').textContent = article.tag;
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-lead').textContent = article.lead;
            document.getElementById('hero-bg').innerHTML = generateHeroBackground(article);

            const sectionsHtml = article.sections.map(section => `
                <div class="article-section">
                    <h2>${section.title}</h2>
                    <p>${section.content}</p>
                </div>
            `).join('');

            const nextArticle = articles.find(a => a.id === article.nextArticle);

            document.getElementById('article-body').innerHTML = `
                ${sectionsHtml}
                <div class="article-callout">
                    <p>${article.callout}</p>
                </div>
                <div class="article-nav">
                    <div class="nav-card" onclick="backToMap()">
                        <h3>← Powrót do mapy</h3>
                        <p>Wróć do widoku wszystkich wątków myślowych</p>
                    </div>
                    ${nextArticle ? `
                        <div class="nav-card" onclick="showArticle(articles.find(a => a.id === '${nextArticle.id}'))">
                            <h3>Następny wątek →</h3>
                            <p>${nextArticle.title}</p>
                        </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('article-view').classList.add('visible');
            document.getElementById('map-view').style.display = 'none';
        }

        function backToMap() {
            document.getElementById('article-view').classList.remove('visible');
            setTimeout(() => {
                document.getElementById('map-view').style.display = 'block';
                state.view = 'map';
            }, 300);
        }

        function generateHeroBackground(article) {
            return generateNodeIllustration(article)
                .replace('280 180', '100% 100%')
                .replace('node-svg', 'hero-svg')
                .replace('viewBox="0 0 280 180"', 'viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"');
        }

        // ========== EVENT LISTENERS ==========
        function setupEventListeners() {
            const container = document.getElementById('map-container');

            // Map panning
            container.addEventListener('mousedown', handleMapDragStart);

            // Global mouse/touch events for node dragging
            document.addEventListener('mousemove', handleNodeDrag);
            document.addEventListener('mouseup', handleNodeDragEnd);

            document.addEventListener('touchmove', handleNodeDrag, { passive: false });
            document.addEventListener('touchend', handleNodeDragEnd);

            container.addEventListener('wheel', handleWheel, { passive: false });

            document.getElementById('zoom-in').addEventListener('click', () => zoom(1.2));
            document.getElementById('zoom-out').addEventListener('click', () => zoom(0.8));
            document.getElementById('reset-view').addEventListener('click', resetView);
            document.getElementById('toggle-connections').addEventListener('click', toggleConnections);

            window.addEventListener('resize', handleResize);
        }

        function handleMapDragStart(e) {
            if (e.target.closest('.map-node')) return;
            state.isDragging = true;
            state.dragStart = {
                x: e.clientX - state.mapTransform.x,
                y: e.clientY - state.mapTransform.y
            };
            document.getElementById('map-container').classList.add('dragging');
        }

        function handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            zoom(delta);
        }

        function handleResize() {
            const canvas = document.getElementById('particles');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            updateMinimap();
        }

        function zoom(factor) {
            state.mapTransform.targetScale = Math.max(0.5, Math.min(2, state.mapTransform.targetScale * factor));
        }

        function resetView() {
            state.mapTransform = { x: 0, y: 0, scale: 1, targetScale: 1 };

            // Reset all nodes to original positions
            state.nodes.forEach(node => {
                const article = articles.find(a => a.id === node.id);
                node.baseX = article.position.x;
                node.baseY = article.position.y;
                node.x = article.position.x;
                node.y = article.position.y;
            });

            updateMapTransform();
        }

        function toggleConnections() {
            state.showConnections = !state.showConnections;
            renderConnections();
        }

        function updateMapTransform() {
            const container = document.getElementById('map-container');
            container.style.transform = `translate(${state.mapTransform.x}px, ${state.mapTransform.y}px) scale(${state.mapTransform.scale})`;
        }

        // ========== MINIMAP ==========
        function updateMinimap() {
            const canvas = document.getElementById('minimap');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scaleX = canvas.width / 1600;
            const scaleY = canvas.height / 1000;

            state.nodes.forEach(node => {
                const article = articles.find(a => a.id === node.id);
                ctx.beginPath();
                ctx.arc(
                    node.x * scaleX,
                    node.y * scaleY,
                    4,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = article.color;
                ctx.fill();
            });
        }

        // ========== PHYSICS & ANIMATION ==========
        function animate() {
            state.time += 0.016;

            // Smooth scale
            state.mapTransform.scale += (state.mapTransform.targetScale - state.mapTransform.scale) * 0.1;

            // Map dragging
            if (state.isDragging && !state.draggedNode) {
                const container = document.getElementById('map-container');
                const moveX = event.clientX - state.dragStart.x;
                const moveY = event.clientY - state.dragStart.y;
                state.mapTransform.x = moveX;
                state.mapTransform.y = moveY;
                updateMapTransform();
            } else if (state.isDragging) {
                document.getElementById('map-container').classList.remove('dragging');
                state.isDragging = false;
            }

            // Update nodes physics
            state.nodes.forEach((node, index) => {
                const article = articles.find(a => a.id === node.id);

                // Gentle floating animation (breathing)
                const floatX = Math.sin(state.time * 0.5 + node.offset) * 3;
                const floatY = Math.cos(state.time * 0.7 + node.offset + 1) * 2;

                // Spring force back to base position
                const springForce = 0.02; // Lower = slower return
                const damping = 0.85; // Higher = less bouncy

                if (!state.draggedNode || state.draggedNode !== node.id) {
                    const targetX = article.position.x + floatX;
                    const targetY = article.position.y + floatY;

                    // Apply spring physics
                    const dx = targetX - node.x;
                    const dy = targetY - node.y;

                    node.vx += dx * springForce;
                    node.vy += dy * springForce;

                    node.vx *= damping;
                    node.vy *= damping;

                    node.x += node.vx;
                    node.y += node.vy;
                }

                // Anti-collision: nodes repel each other
                state.nodes.forEach((otherNode, otherIndex) => {
                    if (index === otherIndex) return;

                    const dx = otherNode.x - node.x;
                    const dy = otherNode.y - node.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = 320; // Minimum distance between nodes

                    if (distance < minDistance && distance > 0) {
                        const force = (minDistance - distance) / minDistance;
                        const repelX = (dx / distance) * force * 2;
                        const repelY = (dy / distance) * force * 2;

                        node.x -= repelX;
                        node.y -= repelY;
                    }
                });

                // Update DOM position
                const nodeElement = document.querySelector(`[data-id="${node.id}"]`);
                if (nodeElement) {
                    nodeElement.style.left = node.x + 'px';
                    nodeElement.style.top = node.y + 'px';
                }
            });

            renderConnections();
            updateMinimap();

            state.animationFrame = requestAnimationFrame(animate);
        }

        // ========== START ==========
        document.addEventListener('DOMContentLoaded', init);
    </script>
