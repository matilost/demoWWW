<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Domek 3D/AR Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #ui-panel h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #status {
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.9;
            min-height: 20px;
        }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-ar:hover {
            background: linear-gradient(135deg, #5568d3 0%, #653a8b 100%);
        }

        /* Controls Info */
        #controls-info {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* AR Instructions */
        #ar-instructions {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            display: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #ui-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                min-width: auto;
                padding: 15px;
            }

            #ui-panel h1 {
                font-size: 20px;
            }

            #controls-info {
                font-size: 11px;
            }
        }

        /* Hide on AR */
        body.ar-active #ui-panel {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="loading-screen">
        <div class="loader"></div>
        <div style="font-size: 18px; font-weight: 500;">Ładowanie modelu 3D...</div>
        <div id="loading-percent" style="font-size: 14px; opacity: 0.8; margin-top: 10px;">0%</div>
    </div>

    <div id="ui-panel">
        <h1>🏠 Domek 3D/AR</h1>
        <div id="status">Inicjalizacja...</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <button id="btn-ar" class="btn btn-ar" disabled>Start AR</button>
        <button id="btn-reset" class="btn">Reset kamery</button>
        <div id="controls-info">
            <strong>Sterowanie 3D:</strong><br>
            🖱️ LPM: obrót<br>
            🖱️ PPM: przesuwanie<br>
            🖱️ Scroll: zoom
        </div>
    </div>

    <div id="ar-instructions">Dotknij, aby umieścić domek</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ===== GLOBAL STATE =====
        let scene, camera, renderer, controls;
        let model, modelBoundingBox;
        let reticle, hitTestSource, hitTestSourceRequested = false;
        let arSession = null;
        let isARMode = false;
        let placedModel = null;

        // UI Elements
        const container = document.getElementById('container');
        const statusDiv = document.getElementById('status');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingPercent = document.getElementById('loading-percent');
        const btnAR = document.getElementById('btn-ar');
        const btnReset = document.getElementById('btn-reset');
        const arInstructions = document.getElementById('ar-instructions');

        // ===== INIT SCENE =====
        function initScene() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(5, 3, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(5, 8, 5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 50;
            keyLight.shadow.camera.left = -10;
            keyLight.shadow.camera.right = 10;
            keyLight.shadow.camera.top = 10;
            keyLight.shadow.camera.bottom = -10;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x9090ff, 0.5);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffaa88, 0.3);
            rimLight.position.set(0, 2, -8);
            scene.add(rimLight);

            // Ground (tylko w trybie 3D)
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            ground.name = 'ground';
            scene.add(ground);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2;
            controls.maxDistance = 20;
            controls.maxPolarAngle = Math.PI / 2;
            controls.target.set(0, 1, 0);

            // Reticle dla AR
            const reticleGeometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
            const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            btnAR.addEventListener('click', startAR);
            btnReset.addEventListener('click', resetCamera);

            // Load Model
            loadModel();
        }

        // ===== LOAD MODEL =====
        function loadModel() {
            const loader = new GLTFLoader();

            loader.load(
                './domek.glb',
                (gltf) => {
                    model = gltf.scene;

                    // Enable shadows
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // Calculate bounding box
                    modelBoundingBox = new THREE.Box3().setFromObject(model);
                    const size = new THREE.Vector3();
                    modelBoundingBox.getSize(size);

                    // Center model
                    const center = new THREE.Vector3();
                    modelBoundingBox.getCenter(center);
                    model.position.sub(center);
                    model.position.y += size.y / 2;

                    scene.add(model);

                    // Auto-frame camera
                    frameModel();

                    // Hide loading screen
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        statusDiv.textContent = 'Model załadowany';
                        checkARSupport();
                    }, 500);
                },
                (progress) => {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    loadingPercent.textContent = `${percent}%`;
                },
                (error) => {
                    console.error('Błąd ładowania modelu:', error);
                    statusDiv.textContent = 'Błąd ładowania modelu';
                    loadingScreen.classList.add('hidden');
                }
            );
        }

        // ===== AUTO-FRAME CAMERA =====
        function frameModel() {
            if (!model) return;

            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 2.5; // Padding

            camera.position.set(cameraZ * 0.7, cameraZ * 0.5, cameraZ * 0.7);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        // ===== RESET CAMERA =====
        function resetCamera() {
            frameModel();
            statusDiv.textContent = 'Kamera zresetowana';
        }

        // ===== CHECK AR SUPPORT =====
        async function checkARSupport() {
            if ('xr' in navigator) {
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (supported) {
                        btnAR.disabled = false;
                        statusDiv.textContent = 'AR dostępne! 🚀';
                    } else {
                        handleNoARSupport();
                    }
                } catch (e) {
                    handleNoARSupport();
                }
            } else {
                handleNoARSupport();
            }
        }

        function handleNoARSupport() {
            // iOS Safari fallback
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                statusDiv.innerHTML = 'AR na iOS jest ograniczone w Safari<br>Użyj trybu 3D z dotykiem 👆';
            } else {
                statusDiv.textContent = 'AR niedostępne - używaj trybu 3D';
            }
            btnAR.style.display = 'none';
        }

        // ===== START AR =====
        async function startAR() {
            if (!navigator.xr) return;

            try {
                arSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['dom-overlay'],
                    domOverlay: { root: document.body }
                });

                await renderer.xr.setSession(arSession);
                isARMode = true;
                document.body.classList.add('ar-active');
                arInstructions.style.display = 'block';

                // Hide ground in AR
                const ground = scene.getObjectByName('ground');
                if (ground) ground.visible = false;

                // Hide original model, will place new instance
                if (model) model.visible = false;

                arSession.addEventListener('end', onARSessionEnd);

                // Setup hit test
                arSession.requestReferenceSpace('viewer').then((refSpace) => {
                    arSession.requestHitTestSource({ space: refSpace }).then((source) => {
                        hitTestSource = source;
                    });
                });

                // Touch to place
                renderer.domElement.addEventListener('click', onARTouchPlace);

            } catch (error) {
                console.error('AR Error:', error);
                statusDiv.textContent = 'Nie udało się uruchomić AR';
            }
        }

        // ===== AR SESSION END =====
        function onARSessionEnd() {
            isARMode = false;
            document.body.classList.remove('ar-active');
            arInstructions.style.display = 'none';
            hitTestSource = null;
            hitTestSourceRequested = false;

            // Restore ground
            const ground = scene.getObjectByName('ground');
            if (ground) ground.visible = true;

            // Restore original model
            if (model) model.visible = true;

            // Remove placed model
            if (placedModel) {
                scene.remove(placedModel);
                placedModel = null;
            }

            reticle.visible = false;
            arSession = null;

            statusDiv.textContent = 'AR zakończone';
            renderer.domElement.removeEventListener('click', onARTouchPlace);
        }

        // ===== AR TOUCH PLACE =====
        function onARTouchPlace() {
            if (!reticle.visible || placedModel) return;

            if (model && !placedModel) {
                // Clone model
                placedModel = model.clone();
                placedModel.position.setFromMatrixPosition(reticle.matrix);
                scene.add(placedModel);

                // Add shadow plane under model
                const shadowGeometry = new THREE.PlaneGeometry(2, 2);
                const shadowMaterial = new THREE.ShadowMaterial({ opacity: 0.5 });
                const shadowPlane = new THREE.Mesh(shadowGeometry, shadowMaterial);
                shadowPlane.rotation.x = -Math.PI / 2;
                shadowPlane.position.y = 0.001;
                shadowPlane.receiveShadow = true;
                placedModel.add(shadowPlane);

                arInstructions.textContent = 'Obracaj palcem, pinch = skala';

                // Enable rotation gesture (simplified)
                let lastTouch = null;
                renderer.domElement.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1 && placedModel) {
                        if (lastTouch) {
                            const deltaX = e.touches[0].clientX - lastTouch.clientX;
                            placedModel.rotation.y += deltaX * 0.01;
                        }
                        lastTouch = { clientX: e.touches[0].clientX };
                    } else {
                        lastTouch = null;
                    }
                });
            }
        }

        // ===== WINDOW RESIZE =====
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===== ANIMATION LOOP =====
        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            // AR hit-test
            if (frame && isARMode) {
                if (hitTestSource && !placedModel) {
                    const referenceSpace = renderer.xr.getReferenceSpace();
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            if (!isARMode) {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        // ===== START =====
        initScene();
        animate();
    </script>
</body>
</html>
